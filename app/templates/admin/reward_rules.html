{% extends "base_app.html" %}
{% block title %}Admin · Reward Rules{% endblock %}
{% block content %}
<div class="page-header">
  <div><div class="page-title">Reward System Configuration</div><div class="page-subtitle">Set how many points each financial activity is worth.</div></div>
  <a href="{{ url_for('admin.index') }}" class="btn btn-outline-secondary btn-bb"><i class="fa-solid fa-arrow-left me-2"></i>Back</a>
</div>

<div class="row g-3">
  {% for rule in rules %}
  <div class="col-md-6">
    <div class="bb-card">
      <form method="POST" action="{{ url_for('admin.update_reward_rule', rule_id=rule.id) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <div>
            <div class="fw-bold">{{ rule.label }}</div>
            <div class="text-muted small">{{ rule.description }}</div>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" name="active" {{ 'checked' if rule.active }}>
          </div>
        </div>
        <div class="input-group mt-3">
          <span class="input-group-text">Points</span>
          <input type="number" class="form-control" name="points_value" value="{{ rule.points_value }}" min="0">
          <button class="btn btn-bb-primary" type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
